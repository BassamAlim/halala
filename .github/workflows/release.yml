name: Release

# Builds a release APK and attaches it to a GitHub Release. No store publishing: Halala is
# sideloaded, and the app checks GitHub Releases for updates.
#
# Trigger: push a version tag (v0.1.0) after bumping versionCode/versionName in
# app/build.gradle.kts. Or run it by hand from the Actions tab with a tag name: it builds
# `ref` (main by default) and creates the tag on the commit it built, if it doesn't exist yet.
#
# Repository secrets for signing (all four, or the APK is published unsigned):
#   KEYSTORE_BASE64    release keystore, base64-encoded (base64 -w0 release.jks)
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0); created on the built commit if new'
        required: true
      ref:
        description: 'Branch or commit to build when the tag is new'
        required: false
        default: main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pushed tag builds itself; a manual run builds its ref.
          ref: ${{ inputs.ref || github.ref }}

      - name: Record the commit being built
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provide signing config
        id: signing
        # printf '%s' writes the secret values byte-for-byte; a heredoc would let the shell
        # expand $ and backticks inside passwords. The keytool check fails the job in seconds
        # if the keystore, password and alias don't match, instead of after a full build.
        # With any secret missing, the release goes ahead unsigned rather than failing.
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Signing secrets are missing; building an unsigned APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            printf 'KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/release.jks"
            printf 'KEYSTORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD"
            printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } > .env
          keytool -list -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "signed=true" >> "$GITHUB_OUTPUT"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build release APK
        run: ./gradlew :app:assembleRelease
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Name the APK
        id: apk
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            src=app/build/outputs/apk/release/app-release.apk
            out="halala-$TAG.apk"
          else
            src=app/build/outputs/apk/release/app-release-unsigned.apk
            out="halala-$TAG-unsigned.apk"
          fi
          cp "$src" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # Only used when the tag doesn't exist yet: it is created on the commit just built.
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: Halala ${{ env.TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256

      - name: Remove signing material
        if: always()
        run: rm -f .env "$RUNNER_TEMP/release.jks"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties asks for a JDK 25 daemon; providing it here saves
      # Gradle downloading one on every run.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # With a `.env`, debug builds are signed with the owner's own key (see app/build.gradle.kts),
      # the same one as the releases and as Android Studio builds on the owner's machine, so all
      # of them install over each other and the phone never has to uninstall (which would lose
      # the ledger). Written as in release.yml. Without the secrets (a fork's PR), the build
      # makes a throwaway debug key as usual.
      - name: Provide signing config
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Signing secrets are missing; this debug APK won't install over yours."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            printf 'KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/release.jks"
            printf 'KEYSTORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD"
            printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } > .env
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: halala-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      # Room exports its schema on every build; migrations are written against the checked-in
      # copies, so a schema change must come with its JSON.
      - name: Check Room schemas are committed
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::Room schema changed but app/schemas wasn't committed:"
            git status --porcelain app/schemas
            for f in $(git status --porcelain app/schemas | awk '{print $2}'); do
              find "$f" -type f -print -exec cat {} \;
            done
            exit 1
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Remove signing material
        if: always()
        run: rm -f .env "$RUNNER_TEMP/release.jks"
